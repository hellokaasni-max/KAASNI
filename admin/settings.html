<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Kaasni Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="sidebar">
    <div class="logo">Kaasni</div>
    <nav>
      <a href="/admin/dashboard.html">Dashboard</a>
      <a href="/admin/products.html">Products</a>
      <a href="/admin/categories.html">Categories</a>
      <a href="/admin/orders.html">Orders</a>
      <a href="/admin/customers.html">Customers</a>
      <a href="/admin/banners.html">Banners</a>
      <a href="/admin/settings.html" class="active">Settings</a>
    </nav>
    <div class="sidebar-footer"><button id="logout-btn">Log out</button></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1>Settings</h1>
      <span class="admin-name" id="admin-name"></span>
    </div>
    <div class="content">
      <div class="card">
        <div class="card-head"><h2>Site content</h2></div>
        <div class="card-body">
          <form id="settings-form">
            <div class="field-row">
              <div class="field">
                <label for="site_name">Site name</label>
                <input id="site_name">
              </div>
              <div class="field">
                <label for="site_tagline">Tagline</label>
                <input id="site_tagline">
              </div>
            </div>
            <div class="field">
              <label for="footer_about">Footer "about" text</label>
              <textarea id="footer_about" rows="3"></textarea>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="contact_email">Contact email</label>
                <input id="contact_email" type="email">
              </div>
              <div class="field">
                <label for="contact_phone">Contact phone</label>
                <input id="contact_phone">
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="instagram_url">Instagram URL</label>
                <input id="instagram_url">
              </div>
              <div class="field">
                <label for="facebook_url">Facebook URL</label>
                <input id="facebook_url">
              </div>
            </div>
            <div id="settings-error" class="form-error" style="display:none;"></div>
            <div id="settings-success" class="form-success" style="display:none;">Saved.</div>
            <button class="btn" type="submit">Save settings</button>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h2>Change admin password</h2></div>
        <div class="card-body">
          <form id="password-form">
            <div class="field-row">
              <div class="field">
                <label for="current_password">Current password</label>
                <input id="current_password" type="password" required>
              </div>
              <div class="field">
                <label for="new_password">New password</label>
                <input id="new_password" type="password" required minlength="8">
              </div>
            </div>
            <div id="password-error" class="form-error" style="display:none;"></div>
            <div id="password-success" class="form-success" style="display:none;">Password updated.</div>
            <button class="btn" type="submit">Update password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/admin/js/admin-api.js"></script>
<script src="/admin/js/settings.js"></script>
</body>
</html>
