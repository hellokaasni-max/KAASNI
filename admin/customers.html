<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers — Kaasni Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="sidebar">
    <div class="logo">Kaasni</div>
    <nav>
      <a href="/admin/dashboard.html">Dashboard</a>
      <a href="/admin/products.html">Products</a>
      <a href="/admin/categories.html">Categories</a>
      <a href="/admin/orders.html">Orders</a>
      <a href="/admin/customers.html" class="active">Customers</a>
      <a href="/admin/banners.html">Banners</a>
      <a href="/admin/settings.html">Settings</a>
    </nav>
    <div class="sidebar-footer"><button id="logout-btn">Log out</button></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1>Customers</h1>
      <span class="admin-name" id="admin-name"></span>
    </div>
    <div class="content">
      <div class="card">
        <div class="card-head">
          <input type="text" class="search-input" id="search-input" placeholder="Search name, phone, email…">
        </div>
        <div class="card-body" style="padding:0;">
          <table>
            <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Orders</th><th>Lifetime spend</th><th></th></tr></thead>
            <tbody id="customers-body"><tr><td colspan="6" class="table-empty">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="customer-overlay">
  <div class="drawer">
    <div class="drawer-head">
      <h2 id="customer-drawer-title">Customer</h2>
      <button class="drawer-close" id="customer-drawer-close">&times;</button>
    </div>
    <div id="customer-detail-body"></div>
  </div>
</div>

<script src="/admin/js/admin-api.js"></script>
<script src="/admin/js/customers.js"></script>
</body>
</html>
